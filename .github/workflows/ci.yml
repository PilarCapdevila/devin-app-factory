name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SESSION_SECRET: ci-only-session-secret-not-for-production-0123456789
      SEED_PASSWORD: password123
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Setup (env, migrate, generate, seed)
        run: npm run setup

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Security tests
        # tests/security (incl. its playwright.config.ts) ships with the independent security suite.
        run: |
          if [ -f tests/security/playwright.config.ts ]; then
            npm run test:security
          else
            echo "tests/security/playwright.config.ts not present yet; skipping security tests"
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
